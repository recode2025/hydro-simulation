'domain_sim_detail': 查重报告
'domain_sim_status': 查重状态
'domain_sim_diff': 代码对比
'domain_sim_graph': 抄袭关系网
'domain_sim_graph_api': 抄袭关系网数据
'contest_sim': 比赛代码查重

# list page
'Code Similarity Detection': 代码相似度查重
'Contests & Homework': 比赛 + 作业
'Contests only': 仅比赛
'Homework only': 仅作业
'Contest': 比赛
'End at': 结束时间
'Status': 状态
'Result': 结果
'Operations': 操作
'Not scanned': 未查重
'Not ended yet': 尚未结束
'Scan': 立即查重
'Scan again': 再次查重
'Delete': 删除
'Delete report': 删除报告
'Details': 详情
'Network': 关系网

# queue management
'Scan Queue': 查重队列
'Queued for': 已等待
'min': 分钟
'Run now': 立即执行
'Cancel': 取消
'Force reset': 强制复位
'Retry': 重试

# detail page
'Similarity Report': 查重报告
'Mode': 模式
'Users': 参与用户
'Submissions scanned': 扫描提交数
'Cache hits': 缓存命中
'Fingerprints served from the cache. The scan still re-executed and recomputed every pair — submitted code is immutable, so identical input yields identical output.': 指纹由缓存提供。扫描仍然重新执行并重新计算了每一对——已提交的代码不可变，因此相同输入必然得到相同结果。
'skipped': 已跳过
'Similar pairs': 相似对
'Finished at': 完成时间
'Problem': 题目
'This contest has not been scanned yet.': 该比赛尚未查重。
'Short': 过短
'Large': 超大
'Empty': 空代码
'Skipped submissions are excluded from comparison (over the size limit or empty code). Short code is compared by default.': 被跳过的提交不参与比对（超出大小上限或空代码）。短代码默认参与比对。

# evidence metrics
'Seq': 序列
'Var': 变量
'Func': 函数
'Struct': 结构
'Sequence similarity (token LCS)': 序列相似度（token 最长公共子序列）
'TF-IDF similarity': TF-IDF 相似度
'Variable name similarity': 变量名相似度
'Function similarity': 函数相似度
'Structure similarity': 结构相似度
'Identical comment lines on both sides': 双方完全相同的注释行数
'Sørensen–Dice over k-gram fingerprints — decides the level': 基于 k-gram 指纹的 Sørensen–Dice——决定分级
'Keyword flag (informational, not proof)': 关键字标记（仅供参考，不构成证据）
'Evidence metrics': 证据指标
'Shared comments': 共享注释
'Flags detected': 检测到的关键字

# user query
'Filter by user (name or ID)': 按用户过滤（用户名或 ID）
'No such user in this domain: {0}': 该域中不存在用户：{0}
'User Summary': 用户汇总
'Max similarity': 最高相似度
'Partners': 涉及对方
'Pairs with shared comments': 存在共享注释的对
'The scan is queued and will run soon.': 查重任务已排队，稍后自动执行。
'A previous attempt was interrupted; the scan will restart from the beginning.': 上次扫描被中断，已重新排队，将从第一题开始重扫。
'Scan is in progress; refresh this page later.': 查重进行中，请稍后刷新本页。
'The scan failed: {0}': 查重失败：{0}
'Similar Pairs': 相似代码对
'Suspected and above': 疑似及以上
'High and above': 高度及以上
'Identical only': 仅完全相同
'All problems': 全部题目
'No similar pair found...': 未发现相似代码对……
'Danger Zone': 危险操作
'Rerun scan': 重新查重
'Scan now': 立即查重
'Diff': 对比
'Waiting': 排队中
'Running': 进行中
'Done': 已完成
'Failed': 失败
'Cancelled': 已取消
'This scan was cancelled or deleted by an administrator and will not restart automatically. Use "Scan now" to run it again.': 该扫描已被管理员取消或删除，不会自动重新运行；如需再次查重请点击「立即查重」。

# levels
'Identical': 完全相同
'High': 高度
'Suspected': 疑似
'None': 无

# thresholds
'Thresholds': 相似度阈值
'Similarity thresholds (leave defaults if unsure)': 相似度阈值（不确定时保持默认）
'Identical threshold': 完全相同阈值
'High threshold': 高度相似阈值
'Suspected threshold': 疑似相似阈值

# diff page
'Code Diff': 代码对比
'Back to report': 返回报告
'record': 递交记录
'Sørensen–Dice coefficient over normalized k-gram fingerprints': 基于归一化 k-gram 指纹的 Sørensen–Dice 相似度
'Files too large for highlight; showing plain side-by-side view.': 文件过大无法高亮，已降级为普通并排视图。

# graph page
'Plagiarism Network': 抄袭关系网
'Drag nodes · click a node to highlight · click an edge to open diff': 拖动节点 · 点击节点高亮 · 点击边打开对比
'No similar pair to display': 没有可展示的相似对

# settings
'sim.threshold.identical': 完全相同阈值
'sim.threshold.high': 高度相似阈值
'sim.threshold.suspected': 疑似相似阈值
'sim.kgram': k-gram 长度
'sim.minTokens': 最小 token 数（0 = 不过滤短代码）
'sim.maxCodeSize': 最大代码字节数（保险丝）
'sim.submissionMode': 默认提交取样模式
'sim.scope': 自动扫描范围
'sim.autoScan': 启用自动扫描
'sim.graceMinutes': 赛后延迟（分钟）
'sim.sweepBatch': 每轮兜底扫描数
'sim.scanWindowDays': 兜底扫描回溯窗口（天）
'sim.diffCellLimit': diff 高亮单元格上限
'sim_mode_latest': 每人每题取最后一次提交
'sim_mode_all': 所有提交
'sim_scope_contest': 仅比赛
'sim_scope_homework': 仅作业
'sim_scope_both': 比赛 + 作业
'Claim this queued scan and execute it immediately': 立即认领该排队任务并马上执行
'Collected 0 readable submissions: every submission was skipped as EMPTY — the code storage could not be read. Check the storage service and rescan.': 收集到 0 份可读提交：所有提交都因代码为空被跳过——无法读取代码存储。请检查存储服务后重新扫描。
'Collected 0 submissions: no submission record belongs to this contest. Make sure the contest actually has submissions, then rerun (also try "All submissions" mode).': 收集到 0 份提交：没有任何提交记录属于该比赛。请确认比赛内确实有提交后重试（也可尝试「所有提交」模式）。
'No similar pair found. Detection only compares DIFFERENT users on the same problem; "latest" mode only takes the last submission per user per problem — rescan with "All submissions" or lower thresholds if needed.': 未发现相似对。查重只比较同题的不同用户；「每人每题取最后一次提交」模式只取每人每题的最后一次提交——如需要请用「所有提交」模式重扫或调低阈值。
'Diagnostics': 诊断
'Retrying after error': 出错后自动重试
