# settings
'sim.threshold.identical': 完全相同阈值
'sim.threshold.high': 高度相似阈值
'sim.threshold.suspected': 疑似相似阈值
'sim.kgram': k-gram 长度
'sim.minTokens': 最小 token 数（过滤过短代码）
'sim.maxCodeSize': 最大代码字节数
'sim.submissionMode': 默认提交取样模式
'sim.scope': 自动扫描范围
'sim.autoScan': 启用自动扫描
'sim.graceMinutes': 赛后延迟（分钟）
'sim.sweepBatch': 每轮兜底扫描数
'sim.scanWindowDays': 兜底扫描回溯窗口（天）
'sim.diffCellLimit': diff 高亮单元格上限
'sim_mode_latest': 每人每题取最后一次提交
'sim_mode_all': 所有提交
'sim_scope_contest': 仅比赛
'sim_scope_homework': 仅作业
'sim_scope_both': 比赛 + 作业
