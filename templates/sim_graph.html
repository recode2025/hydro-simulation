{% extends "layout/basic.html" %}
{% block content %}
<link rel="stylesheet" href="{{ UiContext.cdn_prefix }}sim/graph.css?v=5">
<div class="section sim-graph-page">
  <div class="section__header">
    <h1 class="section__title" data-heading>
      {{ _('Plagiarism Network') }}: {{ tdoc.title }}
    </h1>
    <div class="section__tools">
      <a class="rounded button" href="{{ urlBack }}">{{ _('Back to report') }}</a>
    </div>
  </div>
  <div class="section__body sim-graph-toolbar">
    <span class="sim-graph-legend">
      <label class="sim-graph-check"><input type="checkbox" data-sim-level="1" checked> <span class="sim-dot sim-dot--1"></span> {{ _('Suspected') }} <span data-sim-count="1">0</span></label>
      <label class="sim-graph-check"><input type="checkbox" data-sim-level="2" checked> <span class="sim-dot sim-dot--2"></span> {{ _('High') }} <span data-sim-count="2">0</span></label>
      <label class="sim-graph-check"><input type="checkbox" data-sim-level="3" checked> <span class="sim-dot sim-dot--3"></span> {{ _('Identical') }} <span data-sim-count="3">0</span></label>
    </span>
    <span class="supplementary sim-graph-tip">{{ _('Drag nodes · click a node to highlight · click an edge to open diff') }}</span>
    <span class="supplementary sim-graph-stat" data-sim-stat></span>
  </div>
  <div class="section__body no-padding sim-graph-container" data-sim-graph
       data-url="{{ apiUrl }}" data-level="{{ level }}"
       data-msg-fail="{{ _('Failed to load graph data') }}">
    <canvas class="sim-graph-canvas"></canvas>
    <div class="sim-graph-tooltip" data-sim-tooltip hidden></div>
    <div class="sim-graph-empty" data-sim-empty hidden>{{ _('No similar pair to display') }}</div>
  </div>
</div>
{% endblock %}
{% block script %}
<script src="{{ UiContext.cdn_prefix }}sim/graph.js?v=5" defer></script>
{% endblock %}
